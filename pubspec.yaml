name: tachyon
description: "Ultra-optimized, lightweight music player with continuous crossfade and advanced DSP effects."

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  http: ^1.6.0
  permission_handler: ^13.0.2
  external_path: ^3.0.0
  jsonc: ^0.0.3
  device_info_plus: ^13.3.0
  path: ^1.9.1
  crypto: ^3.0.8
  convert: ^3.1.2
  dio: ^5.11.1
  archive: ^4.5.2
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  file_picker: ^13.3.0
  flutter_markdown_plus: ^1.0.12
  haudiotagger: ^3.1.0
  sqlite3: ^3.8.0
  miniaudio_player: ^3.0.1
  audio_service: ^0.18.19
  smtc_windows: ^1.1.0
  dbus: ^0.8.0
  win32_registry: ^3.0.3
  win32: ^6.4.0
  ffi: ^2.2.0
  flutter_rust_bridge: ^2.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - CHANGELOG.md
    - third_party_licenses/
    - assets/icon/icon_small.webp
    - i18n/

flutter_launcher_icons:
  image_path: "assets/icon/icon.webp"
  android: true
  ios:
    generate: true
    remove_alpha_ios: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
    image_path: "assets/icon/icon.webp"
