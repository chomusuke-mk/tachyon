name: tachyon
title: Tachyon
adopt-info: tachyon
summary: Ultra-optimized music player with continuous crossfade and DSP effects
description: |
  Meet Tachyon, an ultra-fast, modern, and lightweight open-source music player designed for audiophiles and power users who demand high fidelity, fluid performance, and an elegant Material 3 interface.

  Key Features:
  - Ultra-Low Resource Usage: Built-in minimized mode suspends rendering, purges graphics memory, and throttles background timers for maximum efficiency and minimal resource consumption.
  - High-Fidelity Audio Engine: Custom-built miniaudio_player native C-FFI engine with seamless continuous 25ms crossfade (Equal-Power and Linear curves), true gapless playback, and volume boost up to 200%.
  - Studio-Grade DSP Effects: Real-time 10-band equalizer, Bauer Crossfeed (bs2b) for natural, fatigue-free headphone listening, stereo widener / spatializer, Freeverb algorithmic reverb with customizable room acoustics, true-peak limiter, pitch shifting, and variable speed control (0.5x–1.5x).
  - In-Memory Relational Graph: Instantaneous O(1) library navigation powered by a unified relational graph (LibraryStore) with zero UI jank and pure Dart isolate metadata extraction.
  - Synchronized Lyrics: Hierarchical multi-source lyrics resolution (embedded tags, local .lrc files, LRCLIB, and lyrics.ovh) with real-time O(log n) scrolling, tap-to-seek, and automated translation.
  - Modern Adaptive UI: Material 3 design with dynamic color schemes, pure OLED dark mode, responsive desktop layout, and complete multi-language support (i18n).
  - Privacy-Focused & 100% FOSS: Completely offline-first with zero telemetry, zero analytics, and no ads.

contact: https://github.com/chomusuke-mk/tachyon/issues
license: GPL-3.0-or-later
issues: https://github.com/chomusuke-mk/tachyon/issues
source-code: https://github.com/chomusuke-mk/tachyon
website: https://chomusuke.dev
donation:
  - https://patreon.com/chomusuke_dev
  - https://buymeacoffee.com/chomusuke
icon: snap/gui/tachyon.png
type: app

grade: stable
confinement: strict
compression: xz
base: core24

apps:
  tachyon:
    command: tachyon
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - opengl
      - wayland
      - audio-playback
    environment:
      # Fix for some Flutter apps under strict confinement finding their own assets
      FLUTTER_ASSET_DIR: $SNAP/data/flutter_assets

parts:
  tachyon:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    override-build: |
      # 0. Set dynamic version from pubspec.yaml
      VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | xargs)
      craftctl set version="$VERSION"
      craftctl default
